name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck + validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Shellcheck (POSIX sh; severity=style by default; package-wide)
        run: |
          set -e
          files=$(find SKILL/scripts SKILL/scripts/os -type f -name '*.sh' | sort)
          echo "Running shellcheck on: $files"
          for f in $files; do
            # Severity=style: only the non-blocker findings are reported
            # by the local convention; --severity=error is the gate.
            shellcheck --severity=error "$f" || { echo "shellcheck error in $f"; exit 1; }
          done
          echo "shellcheck (errors only) PASS"
      - name: Validators on the replica fixture
        run: |
          set -e
          sh SKILL/scripts/validate_dag.sh runs/20261001-replica/ledger.yaml
          sh SKILL/scripts/validate_ledger_closed.sh --require-evidence runs/20261001-replica/ledger.yaml
          echo "validators PASS"
      - name: sh -n smoke
        run: |
          set -e
          for f in $(find SKILL/scripts SKILL/scripts/os -type f -name '*.sh' | sort); do
            sh -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "sh -n PASS"
