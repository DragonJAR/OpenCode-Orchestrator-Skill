name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: shellcheck + sh -n + package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The skill ships POSIX sh scripts with per-OS adapters, so the same
        # tree has to pass on every platform a user may run it on.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on the Windows runner: the scripts are POSIX sh.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -y && sudo apt-get install -y shellcheck ;;
            macOS)   brew install shellcheck ;;
            Windows) choco install shellcheck --no-progress -y ;;
          esac
      - name: Shellcheck (errors only, package-wide)
        run: |
          set -e
          files=$(find SKILL/scripts SKILL/scripts/os -type f -name '*.sh' | sort)
          echo "Running shellcheck on: $files"
          for f in $files; do
            # Severity=error is the gating rule. Info/warning findings are
            # not gating (the package is expected to run clean at error
            # level; see CHANGELOG.md for the defect classes fixed so far).
            shellcheck --severity=error "$f" || { echo "shellcheck error in $f"; exit 1; }
          done
          echo "shellcheck (errors only) PASS"
      - name: sh -n smoke
        run: |
          set -e
          for f in $(find SKILL/scripts SKILL/scripts/os -type f -name '*.sh' | sort); do
            sh -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "sh -n PASS"
      - name: Build the distributable package
        run: |
          set -e
          sh SKILL/scripts/package.sh
          test -f dist/opencode-orchestrator-skill.zip
          echo "package build PASS"
      - name: Windows proxy (no CR in the values the shell reads)
        run: |
          set -e
          # On Windows a text-mode print() ends the line with CRLF, and the
          # shell then reads the CR as part of the value (a session id, a
          # cursor, a count). This forces that behaviour on EVERY runner, so
          # the regression is caught everywhere and not only on Windows.
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available: skipping the CRLF proxy"; exit 0; }
          SIM="$(mktemp -d)"
          SITE="$SIM/site"; BIN="$SIM/bin"
          mkdir -p "$SITE" "$BIN"
          REAL_PY="$(command -v python3)"
          printf '%s\n' 'import sys' 'try:' '    sys.stdout.reconfigure(newline="\r\n")' 'except Exception:' '    pass' > "$SITE/sitecustomize.py"
          printf '%s\n' '#!/bin/sh' "export PYTHONPATH=\"$SITE:\${PYTHONPATH:+:\$PYTHONPATH}\"" "exec \"$REAL_PY\" \"\$@\"" > "$BIN/python3"
          chmod +x "$BIN/python3"
          PATH="$BIN:$PATH"; export PATH
          . SKILL/scripts/os/_paths.sh
          . SKILL/scripts/os/_common.sh
          v=$(printf '{"id":"ses_x","n":7}' | json_get_field id)
          [ "$v" = "ses_x" ] || { echo "CR contamination in the extracted value: [$v]"; exit 1; }
          n=$(printf '{"id":"ses_x","n":7}' | json_get_field n)
          [ "$n" = "7" ] || { echo "CR contamination in the extracted number: [$n]"; exit 1; }
          echo "CRLF proxy PASS"
      # Note: validate_dag.sh and validate_ledger_closed.sh require a
      # ledger fixture under runs/, which is gitignored (the directory
      # contains prior run evidence; AGENTS.md treats runs/ as
      # default-deny). The validators are run locally on the
      # maintainer's machine; CI does not bundle the fixture to keep
      # the workflow self-contained.
