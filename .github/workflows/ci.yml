name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: shellcheck + sh -n + package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The skill ships POSIX sh scripts with per-OS adapters, so the same
        # tree has to pass on every platform a user may run it on.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on the Windows runner: the scripts are POSIX sh.
        shell: bash
    env:
      # The same environment the skill's own scripts force (LC_ALL=C in
      # os/_common.sh): a python that reads a file must not decode it with
      # the LOCALE's encoding. On Windows that is cp1252, and "version" with
      # its accent came out as mojibake that the comparison could not
      # parse. With LC_ALL=C the interpreter runs in UTF-8 mode everywhere.
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -y && sudo apt-get install -y shellcheck ;;
            macOS)   brew install shellcheck ;;
            Windows) choco install shellcheck --no-progress -y ;;
          esac
      - name: Collect the shipped files (one list for every check below)
        run: |
          set -e
          # ONE list, from the packaging recipe: the closed list IS the single
          # source of truth for what ships. The checks below used to rebuild
          # the same set with three different expressions (SKILL/scripts,
          # SKILL/scripts SKILL/scripts/os, rglob("*.sh")): the same set
          # written three ways is a list that drifts.
          sh SKILL/scripts/package.sh --list > "$RUNNER_TEMP/shipped.txt"
          grep '\.sh$'  "$RUNNER_TEMP/shipped.txt" | sed 's#^#SKILL/#' | tr '\n' ' ' > "$RUNNER_TEMP/sh_files.txt"
          grep '\.awk$' "$RUNNER_TEMP/shipped.txt" | sed 's#^#SKILL/#' | tr '\n' ' ' > "$RUNNER_TEMP/awk_files.txt"
          echo "SH_FILES=$(cat "$RUNNER_TEMP/sh_files.txt")" >> "$GITHUB_ENV"
          echo "AWK_FILES=$(cat "$RUNNER_TEMP/awk_files.txt")" >> "$GITHUB_ENV"
          echo "shipped files: $(wc -l < "$RUNNER_TEMP/shipped.txt")"
      - name: Shellcheck (errors only, package-wide)
        run: |
          set -e
          echo "Running shellcheck on: $SH_FILES"
          for f in $SH_FILES; do
            # Severity=error is the gating rule. Info/warning findings are
            # not gating (the package is expected to run clean at error
            # level; see CHANGELOG.md for the defect classes fixed so far).
            shellcheck --severity=error "$f" || { echo "shellcheck error in $f"; exit 1; }
          done
          echo "shellcheck (errors only) PASS"
      - name: POSIX compatibility (no bash-only construct in a #!/bin/sh script)
        run: |
          set -e
          # The error-level lint above runs shellcheck in its DEFAULT dialect,
          # which is bash: a bash-only construct in a #!/bin/sh script passes
          # every push and breaks only on a dash runner (Linux, WSL, Alpine).
          # The POSIX findings are WARNING level in shellcheck, so this step
          # asks for them explicitly and fails on the SC3xxx family only (the
          # rest of the warning level is not about POSIX).
          failed=0
          for f in $SH_FILES; do
            out=$(shellcheck --shell=sh --severity=warning "$f" 2>&1 || true)
            hits=$(printf '%s\n' "$out" | grep -E 'SC3[0-9]{3}' || true)
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "ERROR: a bash-only construct in a POSIX sh script (SC3xxx family)"
            exit 1
          fi
          echo "POSIX compatibility PASS"
      - name: sh -n smoke
        run: |
          set -e
          for f in $SH_FILES; do
            sh -n "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "sh -n PASS"
      - name: The awk libraries parse
        run: |
          set -e
          # The awk libraries hold the ONE JSON extraction formula and the ONE
          # validator helper set. A syntax error in them breaks every session
          # operation, and nothing in the gate parsed them.
          for f in $AWK_FILES; do
            if ! awk -f "$f" </dev/null; then
              echo "ERROR: the awk library does not parse: $f"
              exit 1
            fi
          done
          echo "awk libraries PASS"
      - name: Build the distributable package
        run: |
          set -e
          # The recipe also checks that the closed list covers EVERY file
          # under SKILL/: the inventory comparison is derived from the list
          # itself, so on its own it cannot see a file that is not in it.
          sh SKILL/scripts/package.sh
          test -f dist/opencode-orchestrator-skill.zip
          echo "package build PASS"
      - name: Windows proxy (no CR in the values the shell reads)
        run: |
          set -e
          # On Windows a text-mode print() ends the line with CRLF, and the
          # shell then reads the CR as part of the value (a session id, a
          # cursor, a count). This forces that behaviour on EVERY runner, so
          # the regression is caught everywhere and not only on Windows.
          command -v python3 >/dev/null 2>&1 || { echo "python3 not available: skipping the CRLF proxy"; exit 0; }
          # os/_common.sh is SOURCED, so $0 is THIS shell's path, not the
          # library's directory. The shared awk library (scripts/_json.awk) is
          # located from what the CALLER knows: the real callers export
          # SELF_DIR, and this step has to do the same or the library is not
          # found and the extraction fails closed. Exporting it also loads the
          # per-OS adapter, so this step exercises the real resolution.
          SELF_DIR="$(cd SKILL/scripts && pwd)"; export SELF_DIR
          . SKILL/scripts/os/_paths.sh
          . SKILL/scripts/os/_common.sh
          # The proxy is ONE python that ends its line with CRLF, asked for
          # where it matters (the same interpreter the `py` helper runs). It
          # used to be installed through a PATH wrapper and a sitecustomize
          # directory: on Windows the PYTHONPATH separator is ';' and not ':',
          # so the injection never reached the interpreter and the step
          # failed there. Asking the interpreter directly is the same test
          # with no PATH, no PYTHONPATH and no platform separator.
          #
          # The proxy must be ARMED: the python's own output has to carry
          # the CR. Without this assertion the step could not fail at all --
          # `py` strips the CR itself, so the comparison below passed with
          # AND without contamination (the guard said the truth and stopped
          # nothing). Armed here, the failure it names is real.
          #
          # The CR is measured on the bytes the interpreter WRITES to a file,
          # not on what the shell keeps in a variable: on Windows the
          # shell's own pipe handling may normalize the CR before the
          # variable, and then the assertion would be measuring the
          # platform instead of the proxy.
          python3 -c 'import sys; sys.stdout.reconfigure(newline="\r\n"); print("ses_x")' > "$RUNNER_TEMP/crlf.txt"
          if ! od -An -tx1 < "$RUNNER_TEMP/crlf.txt" | tr ' ' '\n' | grep -qx '0d'; then
            echo "ERROR: the CRLF proxy is not armed: the python output carries no CR"
            od -An -tx1 < "$RUNNER_TEMP/crlf.txt"
            exit 1
          fi
          # And the value the shell READS through the helper must not carry
          # it: that is what the `py` helper is for.
          v=$(py -c 'import sys; sys.stdout.reconfigure(newline="\r\n"); print("ses_x")')
          [ "$v" = "ses_x" ] || { echo "CR contamination in a value read from python: [$v]"; exit 1; }
          n=$(py -c 'import sys; sys.stdout.reconfigure(newline="\r\n"); print(7)')
          [ "$n" = "7" ] || { echo "CR contamination in a number read from python: [$n]"; exit 1; }
          v=$(printf '{"id":"ses_x","n":7}' | json_get_field id)
          [ "$v" = "ses_x" ] || { echo "wrong extracted value: [$v]"; exit 1; }
          n=$(printf '{"id":"ses_x","n":7}' | json_get_field n)
          [ "$n" = "7" ] || { echo "wrong extracted number: [$n]"; exit 1; }
          echo "CRLF proxy PASS"
      - name: No dead variable in the shipped tree (shellcheck SC2034)
        run: |
          set -e
          # SC2034 is a WARNING, so the error-level lint above never saw it: a
          # variable that is assigned and never read is dead code, and this
          # step is what keeps it from coming back. Only SC2034 is checked
          # here (it is a stable check, so a newer shellcheck cannot turn the
          # build red for an unrelated warning).
          # shellcheck's exit status is 1 when it FINDS something and >1 when
          # it could not analyse the file; the old `shellcheck | grep -q` threw
          # that status away, so a shellcheck that could not run left the step
          # green. Here the status is read.
          failed=0
          for f in $SH_FILES; do
            # The `if` form, NOT `out=$(...); rc=$?`: the runner's shell runs
            # with `set -e`, and an assignment whose command substitution fails
            # aborts the step BEFORE the status can be read. Inside `if` the
            # command is exempt from `set -e` and its status is readable.
            if out=$(shellcheck --severity=warning "$f" 2>&1); then rc=0; else rc=$?; fi
            if [ "$rc" -gt 1 ]; then
              printf '%s\n' "$out"
              echo "ERROR: shellcheck could not analyse $f"
              failed=1
            fi
            if printf '%s\n' "$out" | grep -q 'SC2034'; then
              printf '%s\n' "$out" | grep -B 3 'SC2034' || true
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "ERROR: a variable is assigned and never read (SC2034): dead code"
            exit 1
          fi
          echo "no dead variables in the shipped tree"
      - name: The command table matches the code
        run: |
          set -e
          # The command table in SKILL.md is a PROMISE about the command
          # surface. A subcommand or a flag written there and absent from the
          # code is a promise the code does not keep. A row whose command does
          # not parse is reported too: it used to be SKIPPED, and a skipped row
          # is an unchecked promise.
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path("SKILL")
          # UTF-8 EXPLICITLY: the files are UTF-8 whatever the locale says
          # (on Windows the locale encoding is cp1252 and a file with an
          # accent would be read as mojibake).
          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          code = "\n".join(p.read_text(encoding="utf-8") for p in sorted(root.rglob("*.sh")))
          bad, seen = [], set()
          for line in skill.splitlines():
              if not line.startswith("|") or "orchestrate.sh" not in line:
                  continue
              spans = [s for s in re.findall(r"`([^`]+)`", line) if "orchestrate.sh" in s]
              if not spans:
                  bad.append("a table row mentions orchestrate.sh but writes no command")
                  continue
              for span in spans:
                  m = re.search(r"orchestrate\.sh\s+([a-z-]+)([^`]*)", span)
                  if not m:
                      bad.append(f"a table row writes a command that does not parse: {span}")
                      continue
                  cmd, flags = m.group(1), m.group(2)
                  if (cmd, flags) in seen:
                      continue
                  seen.add((cmd, flags))
                  if not re.search(r"^  " + re.escape(cmd) + r"\)", code, re.M):
                      bad.append(f"subcommand {cmd}: not in the dispatch")
                  for f in sorted(set(re.findall(r"(?<![\w-])--[a-z][a-z0-9-]*", flags))):
                      if not re.search(re.escape(f) + r"(\)|=\*\))", code):
                          bad.append(f"flag {f} (of {cmd}): no parse branch")
          print(f"command-table rows checked: {len(seen)}")
          for b in bad:
              print("  " + b)
          sys.exit(1 if bad else 0)
          PY
      - name: The version is the same in the three public sources
        run: |
          set -e
          # The version is published in three places (the skill's frontmatter
          # and the two README badges). They drifted apart once, and the
          # class guard that noticed it is maintainer-internal, so the public
          # gate carries the check.
          python3 - <<'PY'
          import re, pathlib, sys
          # UTF-8 EXPLICITLY: the files are UTF-8 whatever the locale says
          # (on Windows the locale encoding is cp1252 and "version" with its
          # accent would be read as mojibake the comparison cannot parse).
          skill = pathlib.Path("SKILL/SKILL.md").read_text(encoding="utf-8")
          en = pathlib.Path("README.md").read_text(encoding="utf-8")
          es = pathlib.Path("README.es.md").read_text(encoding="utf-8")
          v1 = re.search(r'skill_version:\s*"([0-9.]+)"', skill)
          v2 = re.search(r"release-([0-9.]+)", en)
          v3 = re.search(r"versi.n-([0-9.]+)", es)
          vals = {"SKILL/SKILL.md": v1.group(1) if v1 else None,
                  "README.md": v2.group(1) if v2 else None,
                  "README.es.md": v3.group(1) if v3 else None}
          if len(set(vals.values())) != 1:
              print("ERROR: the public sources disagree about the version:")
              for k, v in vals.items():
                  print(f"  {k} = {v}")
              sys.exit(1)
          print(f"version coherent: {vals['SKILL/SKILL.md']}")
          PY
      # Note: the defect-class guard (one rule per class in this project's
      # history) is MAINTAINER-INTERNAL, like the regression suite: it lives
      # with the other private maintenance tools and is not in this
      # repository, so the workflow cannot run it and the class sweep is a
      # LOCAL gate. The same applies to the validators below.
      # Note: validate_dag.sh and validate_ledger_closed.sh require a
      # ledger fixture under runs/, which is gitignored (the directory
      # contains prior run evidence; AGENTS.md treats runs/ as
      # default-deny). The validators are run locally on the
      # maintainer's machine; CI does not bundle the fixture to keep
      # the workflow self-contained.
